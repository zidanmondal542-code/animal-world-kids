
name: Build Animal World APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game
        run: unzip -q AnimalWorldAndroid_PhoneBuild.zip -d source

      - name: Build APK
        run: gradle -p source/AnimalWorldAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AnimalWorldKids-APK
          path: source/AnimalWorldAndroid/app/build/outputs/apk/debug/app-debug.apk
